<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>brainplaying — Classifica</title>
  <link rel="stylesheet" href="../styles/dashboard.css" />
  <style>
    .leaderboard-item {
      display: grid;
      grid-template-columns: 80px 1fr auto;
      align-items: center;
      gap: 1.5rem;
      padding: 1.2rem;
      background: var(--card);
      border: 3px solid var(--ink);
      border-radius: 20px;
      box-shadow: 0 4px 0 var(--ink);
      transition: all 0.2s;
    }

    .leaderboard-item:hover {
      transform: translateY(-4px);
      box-shadow: 0 8px 0 var(--ink);
    }

    .rank-badge {
      width: 60px;
      height: 60px;
      display: grid;
      place-items: center;
      border-radius: 15px;
      font-weight: 900;
      font-size: 1.5rem;
      border: 3px solid var(--ink);
    }

    .rank-1 { background: var(--coin); color: white; transform: scale(1.1); box-shadow: 0 4px 0 var(--ink); }
    .rank-2 { background: #cbd5e0; color: white; transform: scale(1.05); box-shadow: 0 4px 0 var(--ink); }
    .rank-3 { background: #ed8936; color: white; transform: scale(1.02); box-shadow: 0 4px 0 var(--ink); }
    .rank-other { background: var(--background); color: var(--ink); }

    .user-avatar {
      width: 50px;
      height: 50px;
      border-radius: 12px;
      display: grid;
      place-items: center;
      background: var(--study-soft);
      border: 2px solid var(--ink);
      font-weight: 900;
      font-size: 1.2rem;
      overflow: hidden;
    }

    .stat-item {
      text-align: center;
      padding: 0 1rem;
    }

    .stat-value {
      display: block;
      font-size: 1.2rem;
      font-weight: 900;
      color: var(--accent);
    }

    .stat-label {
      font-size: 0.7rem;
      text-transform: uppercase;
      opacity: 0.7;
    }

    @media (max-width: 768px) {
      .leaderboard-item {
        grid-template-columns: 60px 1fr;
      }
      .user-stats {
        grid-column: 1 / -1;
        display: flex;
        justify-content: space-around;
        padding-top: 1rem;
        border-top: 2px dashed var(--ink);
      }
    }
  </style>
</head>
<body>
  <!-- Top Nav -->
  <header class="nav" style="position: sticky; top: 0; z-index: 1000; background: rgba(253, 250, 244, 0.8); backdrop-filter: blur(10px); border-bottom: 3px solid var(--ink); padding: 1rem 2rem;">
    <div style="max-width: 1400px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; width: 100%;">
      <a href="home.html" style="display: flex; align-items: center; gap: 0.75rem; text-decoration: none; color: var(--foreground);">
        <span class="text-3xl animate-float-slow" style="font-size: 2rem;">🧠</span>
        <h2 class="text-stroke-ink" style="margin: 0; font-size: 1.5rem; letter-spacing: 2px;">brainplaying</h2>
      </a>
      
      <div style="display: flex; align-items: center; gap: 1rem;">
        <div class="toon-pill" style="background: rgba(236, 201, 75, 0.2); border-color: var(--coin);">
          <span style="font-size: 1.2rem;">🪙</span>
          <span id="navCredits">0</span>
        </div>
        <a href="profile.html" class="toon-btn" style="padding: 0.5rem 1.2rem; font-size: 0.9rem;">
          Profilo
        </a>
      </div>
    </div>
  </header>

  <div class="page-shell">
    <main class="main-content" style="max-width: 1000px; margin: 0 auto; padding: 4rem 2rem;">
      <header style="text-align: center; margin-bottom: 4rem;">
        <h1 class="text-stroke-ink" style="font-size: 4rem; margin: 0;">🏆 Classifica</h1>
        <p style="font-size: 1.2rem; opacity: 0.8; margin-top: 1rem;">Confrontati con gli altri avventurieri e scala la vetta!</p>
      </header>

      <div class="toon-card" style="width: 100%; border-top: 10px solid var(--coin) !important; padding: 2.5rem;">
        <div style="display: flex; justify-content: center; gap: 1rem; margin-bottom: 3rem;">
          <button class="toon-pill filter-btn active" data-period="week" style="cursor:pointer;">Settimana</button>
          <button class="toon-pill filter-btn" data-period="month" style="cursor:pointer;">Mese</button>
          <button class="toon-pill filter-btn" data-period="all" style="cursor:pointer;">Sempre</button>
        </div>

        <div id="leaderboardGrid" style="display: flex; flex-direction: column; gap: 1.2rem;">
          <!-- La classifica verrà popolata dinamicamente -->
          <div style="text-align: center; padding: 3rem; opacity: 0.5;">Caricamento classifica...</div>
        </div>
        
        <div class="empty-state" id="emptyState" style="display: none; text-align: center; padding: 4rem;">
          <div style="font-size: 4rem; margin-bottom: 1rem;">🏜️</div>
          <h3 style="font-family: 'Fredoka';">Nessun dato disponibile</h3>
          <p>Partecipa alle sessioni di studio per apparire nella classifica!</p>
        </div>
      </div>
    </main>
  </div>

  <script src="../js/modules/auth.js"></script>
  <script src="../js/modules/credits.js"></script>
  <script>
    if (!checkAuthentication()) {
      window.location.href = 'index.html';
    }

    // PROFILE UI
    const navAvatar = document.getElementById('navAvatar');
    const user = {
      username: sessionStorage.getItem('username') || 'Studente',
      profileImage: sessionStorage.getItem('profileImage') || ''
    };

    function getInitials(name) {
      return name
        .split(' ')
        .filter(Boolean)
        .slice(0, 2)
        .map((part) => part[0].toUpperCase())
        .join('');
    }

    // LEADERBOARD SYSTEM
    const leaderboardGrid = document.getElementById('leaderboardGrid');
    const emptyState = document.getElementById('emptyState');
    const filterButtons = document.querySelectorAll('.filter-btn');
    let currentPeriod = 'week';

    const usersData = [
      { name: 'Federico', points: 2850, studyHours: 45, sessions: 28, streak: 12 },
      { name: 'Chris', points: 2720, studyHours: 42, sessions: 25, streak: 10 },
      { name: 'Gabriele1', points: 2680, studyHours: 40, sessions: 24, streak: 9 },
      { name: 'Gabriele2', points: 2650, studyHours: 38, sessions: 23, streak: 8 },
      { name: 'Nenna', points: 2620, studyHours: 37, sessions: 22, streak: 7 },
      { name: 'Campanale', points: 2590, studyHours: 36, sessions: 21, streak: 6 },
      { name: 'Sara', points: 2560, studyHours: 35, sessions: 20, streak: 5 },
      { name: 'Paolo', points: 2530, studyHours: 34, sessions: 19, streak: 4 },
      { name: 'Ivan', points: 2500, studyHours: 33, sessions: 18, streak: 3 },
      { name: 'Andon', points: 2470, studyHours: 32, sessions: 17, streak: 2 },
      { name: 'Samir', points: 2440, studyHours: 31, sessions: 16, streak: 1 },
      { name: 'Lorenzo', points: 2410, studyHours: 30, sessions: 15, streak: 0 },
      { name: 'Nicolò', points: 2380, studyHours: 29, sessions: 14, streak: 0 },
      { name: 'Franco', points: 2350, studyHours: 28, sessions: 13, streak: 0 },
      { name: 'Caroti', points: 2320, studyHours: 27, sessions: 12, streak: 0 },
      { name: 'Dario', points: 2290, studyHours: 26, sessions: 11, streak: 0 },
      { name: 'Pier', points: 2260, studyHours: 25, sessions: 10, streak: 0 },
      { name: 'Barzaghi', points: 2230, studyHours: 24, sessions: 9, streak: 0 },
      { name: 'Manca', points: 2200, studyHours: 23, sessions: 8, streak: 0 },
      { name: 'Bonato', points: 2170, studyHours: 22, sessions: 7, streak: 0 },
      { name: 'Amr', points: 2140, studyHours: 21, sessions: 6, streak: 0 },
      { name: 'Daria', points: 2110, studyHours: 20, sessions: 5, streak: 0 },
      { name: 'Emely', points: 2080, studyHours: 19, sessions: 4, streak: 0 }
    ];

    function renderLeaderboard(period) {
      // Ordina e filtra i dati (mock)
      const data = [...usersData].sort((a, b) => b.points - a.points);
      
      if (data.length === 0) {
        leaderboardGrid.style.display = 'none';
        emptyState.style.display = 'block';
        return;
      }
      
      leaderboardGrid.style.display = 'flex';
      emptyState.style.display = 'none';
      
      let leaderboardHTML = '';
      
      data.forEach((user, i) => {
        const rank = i + 1;
        const rankClass = rank === 1 ? 'rank-1' : rank === 2 ? 'rank-2' : rank === 3 ? 'rank-3' : 'rank-other';
        const rankIcon = rank === 1 ? '🥇' : rank === 2 ? '🥈' : rank === 3 ? '🥉' : rank;
        
        leaderboardHTML += `
          <div class="leaderboard-item">
            <div class="rank-badge ${rankClass}">
              ${rankIcon}
            </div>
            <div style="display: flex; align-items: center; gap: 1rem;">
              <div class="user-avatar">${getInitials(user.name)}</div>
              <div class="user-details">
                <h3 style="margin: 0; font-family: 'Fredoka';">${user.name}</h3>
                <p style="margin: 0; opacity: 0.7; font-size: 0.9rem;">${user.points} punti</p>
              </div>
            </div>
            <div class="user-stats" style="display: flex; gap: 1rem;">
              <div class="stat-item">
                <span class="stat-value">${user.studyHours}h</span>
                <span class="stat-label">Studio</span>
              </div>
              <div class="stat-item">
                <span class="stat-value">${user.streak}🔥</span>
                <span class="stat-label">Streak</span>
              </div>
            </div>
          </div>
        `;
      });
      
      leaderboardGrid.innerHTML = leaderboardHTML;
    }

    // FILTER HANDLING
    filterButtons.forEach(btn => {
      btn.addEventListener('click', () => {
        filterButtons.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        renderLeaderboard(btn.dataset.period);
      });
    });

    // INIT
    if (window.CreditsModule) {
      window.CreditsModule.updateCreditDisplay();
    }
    renderLeaderboard('week');
  </script>
</body>
</html>
