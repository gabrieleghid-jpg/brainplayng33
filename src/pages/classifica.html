<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>brainplaying — Classifica</title>
  <link rel="stylesheet" href="../styles/dashboard.css" />
  <style>
    .leaderboard-item {
      display: grid;
      grid-template-columns: 80px 1fr auto;
      align-items: center;
      gap: 1.5rem;
      padding: 1.2rem;
      background: var(--card);
      border: 3px solid var(--ink);
      border-radius: 20px;
      box-shadow: 0 4px 0 var(--ink);
      transition: all 0.2s;
    }

    .leaderboard-item:hover {
      transform: translateY(-4px);
      box-shadow: 0 8px 0 var(--ink);
    }

    .rank-badge {
      width: 60px;
      height: 60px;
      display: grid;
      place-items: center;
      border-radius: 15px;
      font-weight: 900;
      font-size: 1.5rem;
      border: 3px solid var(--ink);
    }

    .rank-1 { background: var(--coin); color: white; transform: scale(1.1); box-shadow: 0 4px 0 var(--ink); }
    .rank-2 { background: #cbd5e0; color: white; transform: scale(1.05); box-shadow: 0 4px 0 var(--ink); }
    .rank-3 { background: #ed8936; color: white; transform: scale(1.02); box-shadow: 0 4px 0 var(--ink); }
    .rank-other { background: var(--background); color: var(--ink); }

    .user-avatar {
      width: 50px;
      height: 50px;
      border-radius: 12px;
      display: grid;
      place-items: center;
      background: var(--study-soft);
      border: 2px solid var(--ink);
      font-weight: 900;
      font-size: 1.2rem;
      overflow: hidden;
    }

    .stat-item {
      text-align: center;
      padding: 0 1rem;
    }

    .stat-value {
      display: block;
      font-size: 1.2rem;
      font-weight: 900;
      color: var(--accent);
    }

    .stat-label {
      font-size: 0.7rem;
      text-transform: uppercase;
      opacity: 0.7;
    }

    @media (max-width: 768px) {
      .leaderboard-item {
        grid-template-columns: 60px 1fr;
      }
      .user-stats {
        grid-column: 1 / -1;
        display: flex;
        justify-content: space-around;
        padding-top: 1rem;
        border-top: 2px dashed var(--ink);
      }
    }
  </style>
</head>
<body>
  <!-- Top Nav -->
  <header class="nav" style="position: sticky; top: 0; z-index: 1000; background: rgba(253, 250, 244, 0.8); backdrop-filter: blur(10px); border-bottom: 3px solid var(--ink); padding: 1rem 2rem;">
    <div style="max-width: 1400px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; width: 100%;">
      <a href="home.html" style="display: flex; align-items: center; gap: 0.75rem; text-decoration: none; color: var(--foreground);">
        <span class="text-3xl animate-float-slow" style="font-size: 2rem;">🧠</span>
        <h2 class="text-stroke-ink" style="margin: 0; font-size: 1.5rem; letter-spacing: 2px;">brainplaying</h2>
      </a>
      
      <div style="display: flex; align-items: center; gap: 1rem;">
        <div class="toon-pill" style="background: rgba(236, 201, 75, 0.2); border-color: var(--coin);">
          <span style="font-size: 1.2rem;">🪙</span>
          <span id="navCredits">0</span>
        </div>
        <a href="profile.html" class="toon-btn" style="padding: 0.5rem 1.2rem; font-size: 0.9rem;">
          Profilo
        </a>
      </div>
    </div>
  </header>

  <div class="page-shell">
    <main class="main-content" style="max-width: 1000px; margin: 0 auto; padding: 4rem 2rem;">
      <header style="text-align: center; margin-bottom: 4rem;">
        <h1 class="text-stroke-ink" style="font-size: 4rem; margin: 0;">🏆 Classifica</h1>
        <p style="font-size: 1.2rem; opacity: 0.8; margin-top: 1rem;">Confrontati con gli altri avventurieri e scala la vetta!</p>
      </header>

      <div class="toon-card" style="width: 100%; border-top: 10px solid var(--coin) !important; padding: 2.5rem;">
        <div style="display: flex; gap: 0.75rem; margin-bottom: 3rem; flex-wrap: wrap; justify-content: center;">
          <button class="tab-btn active" data-period="week" style="font-size: 1rem;">📅 Questa Settimana</button>
          <button class="tab-btn" data-period="month" style="font-size: 1rem;">📆 Questo Mese</button>
          <button class="tab-btn" data-period="all" style="font-size: 1rem;">🏆 Sempre</button>
          <button class="toon-btn" onclick="debugLocalStorage()" style="background: #ef4444; color: white; font-size: 0.8rem;">🔍 DEBUG LOCALSTORAGE</button>
          <button class="toon-btn" onclick="debugAdvanced()" style="background: #f59e0b; color: white; font-size: 0.8rem;">🚀 DEBUG AVANZATO</button>
        </div>

        <div id="leaderboardGrid" style="display: flex; flex-direction: column; gap: 1.2rem;">
          <!-- La classifica verrà popolata dinamicamente -->
          <div style="text-align: center; padding: 3rem; opacity: 0.5;">Caricamento classifica...</div>
        </div>
        
        <div class="empty-state" id="emptyState" style="display: none; text-align: center; padding: 4rem;">
          <div style="font-size: 4rem; margin-bottom: 1rem;">🏜️</div>
          <h3 style="font-family: 'Fredoka';">Nessun dato disponibile</h3>
          <p>Partecipa alle sessioni di studio per apparire nella classifica!</p>
        </div>
      </div>
    </main>
  </div>

  <script src="../js/modules/auth.js"></script>
  <script src="../js/modules/credits.js"></script>
  <script>
    if (!checkAuthentication()) {
      window.location.href = 'index.html';
    }

    // PROFILE UI
    const navAvatar = document.getElementById('navAvatar');
    const userData = window.AuthModule?.getUserData?.() || {};
    const user = {
      username: userData.username,
      profileImage: userData.profileImage || ''
    };

    function getInitials(name) {
      return name
        .split(' ')
        .filter(Boolean)
        .slice(0, 2)
        .map((part) => part[0].toUpperCase())
        .join('');
    }

    // LEADERBOARD SYSTEM
    const leaderboardGrid = document.getElementById('leaderboardGrid');
    const emptyState = document.getElementById('emptyState');
    const filterButtons = document.querySelectorAll('.filter-btn');
    let currentPeriod = 'week';

    // Sistema classifica basato su dati reali
    function getRealUsersData() {
        console.log('=== DEBUG COMPLETO CLASSIFICA ===');
        
        // Controlla se l'utente corrente è un ospite
        const currentUser = window.AuthModule?.getUserData?.() || {};
        console.log('1. Utente corrente:', currentUser);
        
        if (currentUser.role === 'guest') {
            console.log('2. Utente è guest - classifica vuota');
            return [];
        }
        
        // PRIMA: Cerca TUTTI gli utenti con dati EXP nel localStorage
        const allUsers = [];
        console.log('3. Ricerca TUTTI gli utenti con dati EXP...');
        
        for (let i = 0; i < localStorage.length; i++) {
            const key = localStorage.key(i);
            if (key && key.startsWith('expData_')) {
                const email = key.replace('expData_', '');
                console.log(`   Trovato EXP per: ${email}`);
                
                // Recupera dati EXP
                const expData = JSON.parse(localStorage.getItem(key) || '{}');
                const totalExp = expData.totalExp || 0;
                
                // Recupera dati di studio
                const studyDataKey = `studyData_${email}`;
                const studyData = JSON.parse(localStorage.getItem(studyDataKey) || '{}');
                
                // Recupera dati utente dal database
                const allUsersData = JSON.parse(localStorage.getItem('brainplayng_users_database') || '{}');
                const userData = allUsersData[email] || {
                    email: email,
                    username: email.split('@')[0],
                    role: 'user'
                };
                
                console.log(`   - Dati EXP:`, expData);
                console.log(`   - Dati utente:`, userData);
                
                allUsers.push({
                    email: email,
                    name: userData.username || email.split('@')[0],
                    points: totalExp,
                    studyHours: Math.floor(totalExp / 50), // 1 ora ogni 50 EXP
                    sessions: Math.floor(totalExp / 100), // 1 sessione ogni 100 EXP
                    streak: studyData.currentStreak || userData.streak || 1,
                    level: expData.level || 1,
                    siteTimeMinutes: studyData.siteTimeToday || 0,
                    minigamesCompleted: studyData.dailyMinigames || 0,
                    schemiCompleted: studyData.dailySchemi || 0,
                    lastActive: userData.lastActive || new Date().toISOString()
                });
            }
        }
        
        console.log('8. Classifica finale:', allUsers);
        console.log('9. Numero utenti in classifica:', allUsers.length);
        
        // Ordina per EXP decrescente
        return allUsers.sort((a, b) => b.points - a.points);
    }

    function renderLeaderboard(period) {
      // Controlla se l'utente è un ospite
      const currentUser = window.AuthModule?.getUserData?.() || {};
      
      if (currentUser.role === 'guest') {
        leaderboardGrid.style.display = 'none';
        emptyState.style.display = 'block';
        emptyState.innerHTML = `
          <div style="font-size: 4rem; margin-bottom: 1rem;">🚫</div>
          <h3 style="font-family: 'Fredoka';">Classifica solo per utenti registrati</h3>
          <p>Registrati o accedi con il tuo account per vedere la classifica!</p>
          <div style="margin-top: 2rem;">
            <a href="index.html" class="toon-btn" style="background: var(--study); color: white;">🔐 Accedi</a>
          </div>
        `;
        return;
      }
      
      // Ottieni dati reali
      const data = getRealUsersData().sort((a, b) => b.points - a.points);
      
      if (data.length === 0) {
        leaderboardGrid.style.display = 'none';
        emptyState.style.display = 'block';
        return;
      }
      
      leaderboardGrid.style.display = 'flex';
      emptyState.style.display = 'none';
      
      let leaderboardHTML = '';
      
      data.forEach((user, i) => {
        const rank = i + 1;
        const rankClass = rank === 1 ? 'rank-1' : rank === 2 ? 'rank-2' : rank === 3 ? 'rank-3' : 'rank-other';
        const rankIcon = rank === 1 ? '🥇' : rank === 2 ? '🥈' : rank === 3 ? '🥉' : rank;
        
        // Evidenzia l'utente corrente
        const isCurrentUser = user.email === currentUser.email;
        const highlightStyle = isCurrentUser ? 'background: linear-gradient(135deg, rgba(124, 58, 237, 0.1), rgba(124, 58, 237, 0.05)); border-color: var(--accent);' : '';
        
        leaderboardHTML += `
          <div class="leaderboard-item" style="${highlightStyle}">
            <div class="rank-badge ${rankClass}">
              ${rankIcon}
            </div>
            <div style="display: flex; align-items: center; gap: 1rem;">
              <div class="user-avatar">${isCurrentUser ? '⭐' : '👤'}</div>
              <div>
                <div style="font-weight: 700; font-size: 1.1rem;">
                  ${user.name} ${isCurrentUser ? '(Tu)' : ''}
                </div>
                <div style="display: flex; gap: 1rem; margin-top: 0.3rem; flex-wrap: wrap;">
                  <span style="font-size: 0.8rem; opacity: 0.7;">📚 ${user.studyHours}h</span>
                  <span style="font-size: 0.8rem; opacity: 0.7;">🎯 ${user.sessions} sessioni</span>
                  <span style="font-size: 0.8rem; opacity: 0.7;">🔥 ${user.streak} streak</span>
                  <span style="font-size: 0.8rem; opacity: 0.7;">⭐ Lv.${user.level}</span>
                  <span style="font-size: 0.8rem; opacity: 0.7;">⏱️ ${user.siteTimeMinutes || 0}min</span>
                  <span style="font-size: 0.8rem; opacity: 0.7;">🎮 ${user.minigamesCompleted || 0}</span>
                  <span style="font-size: 0.8rem; opacity: 0.7;">🗺️ ${user.schemiCompleted || 0}</span>
                </div>
              </div>
            </div>
            <div style="text-align: right;">
              <div style="font-weight: 900; font-size: 1.3rem; color: var(--xp);">${user.points}</div>
              <div style="font-size: 0.8rem; opacity: 0.7;">punti EXP</div>
            </div>
          </div>
        `;
      });
      
      leaderboardGrid.innerHTML = leaderboardHTML;
    }

    // FILTER HANDLING
    filterButtons.forEach(btn => {
      btn.addEventListener('click', () => {
        filterButtons.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        renderLeaderboard(btn.dataset.period);
      });
    });

    // Funzione di debug per localStorage
    function debugLocalStorage() {
        console.log('=== DEBUG LOCALSTORAGE COMPLETO ===');
        
        // Mostra tutti i dati localStorage
        for (let i = 0; i < localStorage.length; i++) {
            const key = localStorage.key(i);
            const value = localStorage.getItem(key);
            console.log(`${key}:`, value);
        }
        
        // Mostra dati utente corrente
        const currentUser = window.AuthModule?.getUserData?.() || {};
        console.log('Utente corrente:', currentUser);
        
        // FORZA SINCRONIZZAZIONE ESP
        forceSyncEXPData();
        
        // Aggiungi manualmente tutti gli utenti per test
        forceAddAllUsersToDatabase();
        
        // Ricarica la classifica
        renderLeaderboard(currentPeriod);
    }

    // Funzione di debug avanzato per test completo
    function debugAdvanced() {
        console.log('=== DEBUG AVANZATO SISTEMA MULTI-UTENTE ===');
        
        // 1. Mostra TUTTO il localStorage
        console.log('1. TUTTO IL LOCALSTORAGE:');
        for (let i = 0; i < localStorage.length; i++) {
            const key = localStorage.key(i);
            const value = localStorage.getItem(key);
            console.log(`   ${key}:`, value);
        }
        
        // 2. Mostra tutto sessionStorage
        console.log('2. TUTTO IL SESSIONSTORAGE:');
        for (let i = 0; i < sessionStorage.length; i++) {
            const key = sessionStorage.key(i);
            const value = sessionStorage.getItem(key);
            console.log(`   ${key}:`, value);
        }
        
        // 3. Mostra database utenti
        const allUsersData = JSON.parse(localStorage.getItem('brainplayng_users_database') || '{}');
        console.log('3. DATABASE UTENTI:', allUsersData);
        
        // 4. Cerca esplicitamente l'utente con 50 EXP
        console.log('4. RICERCA UTENTE CON 50 EXP:');
        for (let i = 0; i < localStorage.length; i++) {
            const key = localStorage.key(i);
            if (key && key.startsWith('expData_')) {
                const expData = JSON.parse(localStorage.getItem(key) || '{}');
                console.log(`   ${key}:`, expData);
                if (expData.totalExp === 50) {
                    console.log('   *** TROVATO UTENTE CON 50 EXP! ***');
                }
            }
        }
        
        // 5. Forza sincronizzazione completa
        forceAddAllUsersToDatabase();
        forceSyncEXPData();
        
        // 6. Ricarica classifica
        renderLeaderboard(currentPeriod);
        
        alert('DEBUG AVANZATO COMPLETATO! Controlla la console per dettagli.');
    }

    // Funzione per aggiungere forzatamente tutti gli utenti al database
    function forceAddAllUsersToDatabase() {
        console.log('=== FORZATURA AGGIUNTA UTENTI ===');
        
        // Cerca tutti i dati EXP nel localStorage
        const allExpKeys = [];
        for (let i = 0; i < localStorage.length; i++) {
            const key = localStorage.key(i);
            if (key && key.startsWith('expData_')) {
                allExpKeys.push(key);
            }
        }
        
        console.log('Chiavi EXP trovate:', allExpKeys);
        
        // Cerca anche tutti i dati di studio
        const allStudyKeys = [];
        for (let i = 0; i < localStorage.length; i++) {
            const key = localStorage.key(i);
            if (key && key.startsWith('studyData_')) {
                allStudyKeys.push(key);
            }
        }
        
        console.log('Chiavi studio trovate:', allStudyKeys);
        
        // Unisci tutte le email trovate
        const allEmails = new Set();
        allExpKeys.forEach(key => allEmails.add(key.replace('expData_', '')));
        allStudyKeys.forEach(key => allEmails.add(key.replace('studyData_', '')));
        
        console.log('Tutte le email trovate:', Array.from(allEmails));
        
        // Per ogni email trovata, aggiungi al database
        const allUsersData = JSON.parse(localStorage.getItem('brainplayng_users_database') || '{}');
        
        allEmails.forEach(email => {
            console.log(`Processando utente: ${email}`);
            
            if (!allUsersData[email]) {
                // Estrai dati utente da vari fonti
                let username = email.split('@')[0];
                let role = 'user';
                
                // Prova a prendere da bp_username
                const bpUsername = localStorage.getItem(`bp_username_${email}`);
                if (bpUsername) username = bpUsername;
                
                // Prova a prendere da sessionStorage (se utente corrente)
                const sessionEmail = sessionStorage.getItem('email');
                if (sessionEmail === email && sessionStorage.getItem('username')) {
                    username = sessionStorage.getItem('username');
                }
                
                allUsersData[email] = {
                    email: email,
                    username: username,
                    role: role,
                    lastActive: new Date().toISOString()
                };
                
                console.log(`NUOVO utente aggiunto: ${email} -> ${username}`);
            } else {
                console.log(`Utente esistente: ${email} -> ${allUsersData[email].username}`);
            }
        });
        
        // Salva il database aggiornato
        localStorage.setItem('brainplayng_users_database', JSON.stringify(allUsersData));
        console.log('Database utenti finale:', allUsersData);
    }

    // Funzione per sincronizzare forzatamente i dati EXP
    function forceSyncEXPData() {
        const currentUser = window.AuthModule?.getUserData?.() || {};
        
        if (currentUser.email && currentUser.role !== 'guest') {
            console.log('=== SINCRONIZZAZIONE ESP FORZATA ===');
            
            // 1. Trova tutti i dati EXP per questa email (case-insensitive)
            const email = currentUser.email.toLowerCase();
            const allExpKeys = [];
            
            for (let i = 0; i < localStorage.length; i++) {
                const key = localStorage.key(i);
                if (key && key.toLowerCase().includes('expdata_')) {
                    allExpKeys.push(key);
                }
            }
            
            console.log('Chiavi EXP trovate:', allExpKeys);
            
            // 2. Trova la chiave corretta per questa email
            let correctExpKey = null;
            let expData = null;
            
            allExpKeys.forEach(key => {
                const keyEmail = key.toLowerCase().replace('expdata_', '');
                if (keyEmail === email) {
                    correctExpKey = key;
                    expData = JSON.parse(localStorage.getItem(key) || '{}');
                }
            });
            
            if (correctExpKey) {
                console.log('Chiave EXP corretta trovata:', correctExpKey);
                console.log('Dati EXP:', expData);
                
                // 3. Assicurati che l'utente sia nel database
                const allUsersData = JSON.parse(localStorage.getItem('brainplayng_users_database') || '{}');
                const userData = allUsersData[currentUser.email];
                
                if (!userData) {
                    console.log('Utente non trovato nel database, lo aggiungo...');
                    window.AuthModule.saveRegisteredUser({
                        username: currentUser.username,
                        email: currentUser.email,
                        role: currentUser.role
                    });
                }
            } else {
                console.log('NESSUNA CHIAVE EXP TROVATA PER:', email);
            }
        }
    }

    // INIT
    if (window.CreditsModule) {
      window.CreditsModule.updateCreditDisplay();
    }
    
    // Sincronizzazione automatica all'avvio
    forceSyncEXPData();
    
    // Sincronizza tutti gli utenti dal localStorage
    forceAddAllUsersToDatabase();
    
    renderLeaderboard('week');
  </script>
</body>
</html>
