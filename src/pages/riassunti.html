<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BrainPlayng - Riassunti AI</title>
  <link rel="stylesheet" href="../styles/dashboard.css" />
  <style>
    textarea {
      width:100%; min-height:180px; padding:1.5rem; border:3px solid var(--ink);
      border-radius:20px; font-family:inherit; font-size:1rem; resize:vertical;
      background:#fff; color:var(--foreground); box-sizing:border-box; transition:all .2s;
      box-shadow: inset 0 4px 0 rgba(0,0,0,0.05);
    }
    textarea:focus { outline:none; border-color:var(--study); }
    .options-row { display:flex; gap:1.5rem; margin-top:1.5rem; flex-wrap:wrap; width: 100%; }
    .select-group { flex:1; min-width:160px; text-align: left; }
    select {
      width:100%; padding:.8rem 1.2rem; border:3px solid var(--ink); border-radius:15px;
      font-family:inherit; font-size:1rem; background:#fff; color:var(--foreground); cursor:pointer;
      box-shadow: 0 4px 0 var(--ink);
    }
    select:active { transform: translateY(2px); box-shadow: 0 2px 0 var(--ink); }
    
    .riassunto-box {
      background:#fff; border:3px solid var(--ink); border-radius:20px;
      padding:1.5rem; line-height:1.7; font-size:1.1rem; white-space:pre-wrap;
      box-shadow: inset 0 4px 0 rgba(0,0,0,0.05);
      text-align: left;
    }
    .parole-chiave { display:flex; flex-wrap:wrap; gap:.8rem; margin-top:1rem; }
    .tag { background:var(--study-soft); color:var(--study); border:2px solid var(--ink); border-radius:12px; padding:.4rem 1rem; font-size:.85rem; font-weight:900; box-shadow: 3px 3px 0 var(--ink); }
    
    .api-notice { background:#fffbeb; border:3px solid var(--ink); border-radius:15px; padding:1rem 1.5rem; font-size:.9rem; color:#92400e; margin-bottom:1.5rem; display:none; box-shadow: 5px 5px 0 var(--ink); }
    .api-notice.visible { display:block; }
    .error-box { background:#fef2f2; border:3px solid var(--ink); border-radius:15px; padding:1rem 1.5rem; color:#ef4444; font-size:.9rem; display:none; box-shadow: 5px 5px 0 var(--ink); }
    .error-box.visible { display:block; }
  </style>
</head>
<body>
  <!-- Top Nav -->
  <header class="nav" style="position: sticky; top: 0; z-index: 1000; background: rgba(253, 250, 244, 0.8); backdrop-filter: blur(10px); border-bottom: 3px solid var(--ink); padding: 1rem 2rem;">
    <div style="max-width: 1400px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; width: 100%;">
      <a href="home.html" style="display: flex; align-items: center; gap: 0.75rem; text-decoration: none; color: var(--foreground);">
        <span class="text-3xl animate-float-slow" style="font-size: 2rem;">🧠</span>
        <h2 class="text-stroke-ink" style="margin: 0; font-size: 1.5rem; letter-spacing: 2px;">brainplaying</h2>
      </a>
      
      <div style="display: flex; align-items: center; gap: 1rem;">
        <div class="toon-pill" style="background: rgba(236, 201, 75, 0.2); border-color: var(--coin);">
          <span style="font-size: 1.2rem;">🪙</span>
          <span id="navCredits">0</span>
        </div>
        <a href="profile.html" class="toon-btn" style="padding: 0.5rem 1.2rem; font-size: 0.9rem;">
          Profilo
        </a>
      </div>
    </div>
  </header>

  <div class="page-shell">
    <main class="main-content" style="max-width: 900px; margin: 0 auto; padding: 4rem 2rem;">
      <header style="text-align: center; margin-bottom: 4rem;">
        <h1 class="text-stroke-ink" style="font-size: 4.5rem; margin: 0;">🤖 Riassunti AI</h1>
        <p style="font-size: 1.2rem; opacity: 0.8; margin-top: 1rem;">Trasforma testi lunghi in concetti chiari in pochi secondi.</p>
      </header>

      <div class="api-notice" id="apiNotice">
        ⚠️ Backend non raggiungibile. Avvia il server con <code>npm start</code> nella root del progetto.
      </div>

      <div class="toon-card" style="width: 100%; border-top: 10px solid var(--study) !important; padding: 2.5rem;">
        <label style="font-family: 'Fredoka'; font-size: 1.4rem; margin-bottom: 1rem; display: block; text-align: left;">📄 Testo da riassumere</label>
        <textarea id="inputTesto" placeholder="Incolla qui il testo (minimo 50 caratteri)..." style="min-height: 250px;"></textarea>

        <div class="options-row" style="margin-top: 2rem;">
          <div class="select-group">
            <label style="font-family: 'Fredoka'; font-size: 1.1rem; margin-bottom: 0.5rem; display: block;">Lingua output</label>
            <select id="selectLingua">
              <option value="italiano">🇮🇹 Italiano</option>
              <option value="inglese">🇬🇧 Inglese</option>
              <option value="spagnolo">🇪🇸 Spagnolo</option>
            </select>
          </div>
          <div class="select-group">
            <label style="font-family: 'Fredoka'; font-size: 1.1rem; margin-bottom: 0.5rem; display: block;">Stile</label>
            <select id="selectStile">
              <option value="scolastico">📚 Scolastico</option>
              <option value="semplice">🌟 Semplice</option>
              <option value="accademico">🎓 Accademico</option>
              <option value="bullet points">📋 Bullet points</option>
            </select>
          </div>
        </div>

        <button class="toon-btn" id="btnGenera" onclick="generaRiassunto()" style="width: 100%; margin-top: 3rem; background: var(--study); color: white; font-size: 1.4rem; padding: 1.2rem;">
          <span id="btnTesto">✨ Genera Riassunto con AI</span>
          <span class="spinner" id="spinner" style="display:none; width: 24px; height: 24px; border: 3px solid rgba(255,255,255,0.3); border-top-color: white; border-radius: 50%; animation: spin 0.8s linear infinite;"></span>
        </button>
      </div>

      <div class="result-section" id="resultSection" style="margin-top: 4rem; width: 100%; display: none;">
        <div class="error-box" id="errorBox"></div>
        <div id="resultContent" class="toon-card" style="display:none; border-top: 10px solid var(--xp) !important; padding: 2.5rem;">
          <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 1.5rem;">
            <label style="font-family: 'Fredoka'; font-size: 1.4rem; margin: 0;">📝 Il tuo Riassunto</label>
            <button class="toon-pill" onclick="copiaRiassunto(event)" style="cursor: pointer; background: var(--study-soft); color: var(--study);">📋 Copia</button>
          </div>
          <div class="riassunto-box" id="riassuntoBox" style="font-size: 1.2rem; background: var(--background); border-radius: 15px; padding: 1.5rem;"></div>
          
          <div style="margin-top:2.5rem; text-align: left;">
            <label style="font-family: 'Fredoka'; font-size: 1.2rem; margin-bottom: 1rem; display: block;">🏷️ Parole chiave</label>
            <div class="parole-chiave" id="paroleChiave"></div>
          </div>
          <div id="titoloBox" style="margin-top:2rem; font-weight: 700; color: var(--foreground); opacity: 0.8; font-style: italic; text-align: left;"></div>
        </div>
      </div>
    </main>
  </div>

<script>
async function generaRiassunto() {
  const testo  = document.getElementById('inputTesto').value.trim();
  const lingua = document.getElementById('selectLingua').value;
  const stile  = document.getElementById('selectStile').value;

  if (testo.length < 50) { alert('Testo troppo breve (minimo 50 caratteri).'); return; }

  const btn = document.getElementById('btnGenera');
  btn.disabled = true;
  document.getElementById('btnTesto').textContent = 'Elaborazione...';
  document.getElementById('spinner').style.display = 'inline-block';
  document.getElementById('resultSection').classList.add('visible');
  document.getElementById('errorBox').classList.remove('visible');
  document.getElementById('resultContent').style.display = 'none';
  document.getElementById('apiNotice').classList.remove('visible');

  try {
    // Chiama il backend Node.js → che usa Claude API
    const data = await apiFetch('/api/riassunti/genera', {
      method: 'POST',
      body: JSON.stringify({ testo, lingua, stile })
    });

    document.getElementById('riassuntoBox').textContent = data.riassunto;
    document.getElementById('resultContent').style.display = 'block';

    const pkContainer = document.getElementById('paroleChiave');
    pkContainer.innerHTML = '';
    (data.paroleChiave || []).forEach(pk => {
      const tag = document.createElement('span');
      tag.className = 'tag';
      tag.textContent = pk;
      pkContainer.appendChild(tag);
    });

    if (data.titoloProposto) {
      document.getElementById('titoloBox').textContent = `💡 Titolo proposto: "${data.titoloProposto}"`;
    }

    // Guadagno crediti per attività di studio
    if (window.CreditsModule) {
      window.CreditsModule.earnCrediti(20, 'Generazione Riassunto AI');
    }
  } catch (err) {
    document.getElementById('errorBox').textContent = '❌ ' + err.message;
    document.getElementById('errorBox').classList.add('visible');
    // Mostra il box "backend non raggiungibile" solo se sembra un errore di rete/proxy.
    const msg = String(err?.message || '');
    if (/failed to fetch/i.test(msg) || /network/i.test(msg) || /backend/i.test(msg)) {
      document.getElementById('apiNotice').classList.add('visible');
    }
  } finally {
    btn.disabled = false;
    document.getElementById('btnTesto').textContent = '✨ Genera Riassunto con AI';
    document.getElementById('spinner').style.display = 'none';
  }
}

function copiaRiassunto(event) {
  const testo = document.getElementById('riassuntoBox').textContent;
  navigator.clipboard.writeText(testo).then(() => {
    event.target.textContent = '✅ Copiato!';
    setTimeout(() => event.target.textContent = '📋 Copia testo', 2000);
  });
}
</script>
</body>
</html>
