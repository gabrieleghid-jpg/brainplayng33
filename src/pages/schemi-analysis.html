<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>brainplaying - Analisi Foto</title>
  <link rel="stylesheet" href="../styles/dashboard.css" />
  <style>
    .upload-preview {
      width: 100%;
      max-width: 400px;
      min-height: 300px;
      border: 3px dashed var(--ink);
      border-radius: 25px;
      display: grid;
      place-items: center;
      background: #fff;
      transition: all 0.3s ease;
      box-shadow: inset 0 4px 0 rgba(0,0,0,0.05);
    }
    
    .upload-preview:hover {
      border-color: var(--study);
      background: var(--study-soft);
    }
    
    .tab-btn {
      padding: 0.8rem 1.5rem;
      border: 3px solid var(--ink);
      background: var(--card);
      color: var(--foreground);
      font-weight: 900;
      cursor: pointer;
      transition: all 0.1s;
      border-radius: 15px;
      box-shadow: 0 4px 0 var(--ink);
      text-transform: uppercase;
      font-size: 0.8rem;
    }
    
    .tab-btn:hover { transform: translateY(-2px); box-shadow: 0 6px 0 var(--ink); }
    .tab-btn.active {
      background: var(--study);
      color: white;
      transform: translateY(2px);
      box-shadow: 0 0 0 var(--ink);
    }
    
    .flashcard-item {
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 1.5rem;
      padding: 1.5rem;
      background: #fff;
      border: 3px solid var(--ink);
      border-radius: 20px;
      box-shadow: 4px 4px 0 var(--ink);
      margin-bottom: 1rem;
      text-align: left;
    }
    
    .flashcard-number {
      width: 45px;
      height: 45px;
      display: grid;
      place-items: center;
      background: var(--accent);
      color: var(--border);
      border: 3px solid var(--ink);
      border-radius: 12px;
      font-weight: 900;
      box-shadow: 3px 3px 0 var(--ink);
    }
    
    .schema-text, .riassunto-text, .contenuto-text {
      background: #fff;
      border: 3px solid var(--ink);
      border-radius: 20px;
      padding: 1.5rem;
      line-height: 1.7;
      color: var(--foreground);
      box-shadow: inset 0 4px 0 rgba(0,0,0,0.05);
      text-align: left;
      white-space: pre-wrap;
    }
    
    .quiz-option {
      display: flex;
      align-items: center;
      gap: 1rem;
      padding: 1rem;
      border: 3px solid var(--ink);
      border-radius: 15px;
      cursor: pointer;
      transition: all 0.1s;
      background: #fff;
      font-weight: 700;
      box-shadow: 0 4px 0 var(--ink);
      margin-bottom: 0.5rem;
    }
    
    .quiz-option:hover { transform: translateY(-2px); box-shadow: 0 6px 0 var(--ink); }
    .quiz-option.selected { background: var(--study-soft); border-color: var(--study); }
    .quiz-option.correct { background: #dcfce7; border-color: #22c55e; color: #166534; }
    .quiz-option.incorrect { background: #fee2e2; border-color: #ef4444; color: #991b1b; }
  </style>
</head>
<body>
  <!-- Top Nav -->
  <header class="nav" style="position: sticky; top: 0; z-index: 1000; background: rgba(253, 250, 244, 0.8); backdrop-filter: blur(10px); border-bottom: 3px solid var(--ink); padding: 1rem 2rem;">
    <div style="max-width: 1400px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; width: 100%;">
      <a href="home.html" style="display: flex; align-items: center; gap: 0.75rem; text-decoration: none; color: var(--foreground);">
        <span class="text-3xl animate-float-slow" style="font-size: 2rem;">🧠</span>
        <h2 class="text-stroke-ink" style="margin: 0; font-size: 1.5rem; letter-spacing: 2px;">brainplaying</h2>
      </a>
      
      <div style="display: flex; align-items: center; gap: 1rem;">
        <div class="toon-pill" style="background: rgba(236, 201, 75, 0.2); border-color: var(--coin);">
          <span style="font-size: 1.2rem;">🪙</span>
          <span id="navCredits">0</span>
        </div>
        <a href="profile.html" class="toon-btn" style="padding: 0.5rem 1.2rem; font-size: 0.9rem;">
          Profilo
        </a>
      </div>
    </div>
  </header>

  <div class="page-shell">
    <main class="main-content" style="max-width: 1000px; margin: 0 auto; padding: 4rem 2rem;">
      <header style="text-align: center; margin-bottom: 4rem;">
        <h1 class="text-stroke-ink" style="font-size: 4.5rem; margin: 0;">🗺️ Generatore Schemi</h1>
        <p style="font-size: 1.2rem; opacity: 0.8; margin-top: 1rem;">Analizza le tue foto di studio e ottieni materiali pronti in un attimo.</p>
      </header>

      <div id="backendNotice" style="display:none; background:#fffbeb; border:3px solid var(--ink); border-radius:15px; padding:1rem 1.5rem; color:#92400e; margin-bottom:1.5rem; box-shadow: 5px 5px 0 var(--ink);">
        ⚠️ <strong>Backend non raggiungibile.</strong> Assicurati che il server backend sia avviato.
      </div>

      <div class="toon-card" style="width: 100%; border-top: 10px solid var(--study) !important; margin-bottom: 4rem; padding: 2.5rem;">
        <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 3rem; align-items: center;">
          <div id="dropZone" class="upload-preview" style="min-height: 350px;">
            <div class="preview-placeholder">
              <div style="font-size: 5rem; margin-bottom: 1.5rem;">📸</div>
              <p style="font-weight: 900; font-size: 1.2rem;">Trascina qui la foto<br>o clicca per caricarla</p>
            </div>
            <img id="imagePreview" style="display:none; width:100%; height:100%; object-fit:contain; border-radius:20px;" />
          </div>

          <div style="display: flex; flex-direction: column; gap: 1.5rem;">
            <input type="file" id="fileInput" accept="image/*" style="display:none" />
            <button class="toon-btn" id="selectBtn" style="background: var(--card); color: var(--foreground); font-size: 1.2rem; padding: 1rem;">📂 Seleziona Foto</button>
            <button class="toon-btn" id="analyzeBtn" disabled style="background: var(--study); color: white; font-size: 1.2rem; padding: 1rem;">🔍 Analizza con AI</button>
            <button class="toon-btn" id="clearBtn" style="background: #fee2e2; color: #ef4444; border-color: #ef4444; display:none; font-size: 1.2rem; padding: 1rem;">🗑️ Rimuovi</button>
          </div>
        </div>
      </div>

      <div id="resultsSection" class="result-section" style="display:none; width: 100%;">
        <div class="toon-card" style="width: 100%; border-top: 10px solid var(--xp) !important; padding: 2.5rem;">
          <div style="display: flex; gap: 0.75rem; margin-bottom: 3rem; flex-wrap: wrap; justify-content: center;">
            <button class="tab-btn active" data-tab="flashcards" style="font-size: 1rem;">🎴 Flashcards</button>
            <button class="tab-btn" data-tab="schema" style="font-size: 1rem;">🗺️ Schema</button>
            <button class="tab-btn" data-tab="riassunto" style="font-size: 1rem;">📝 Riassunto</button>
            <button class="tab-btn" data-tab="quiz" style="font-size: 1rem;">❓ Quiz</button>
          </div>

          <div id="flashcards" class="tab-content active">
            <div class="flashcard-container" id="flashcardContainer"></div>
          </div>

          <div id="schema" class="tab-content">
            <div class="schema-text" id="schemaContainer" style="font-size: 1.1rem; padding: 2rem;"></div>
          </div>

          <div id="riassunto" class="tab-content">
            <div class="riassunto-text" id="riassuntoContainer" style="font-size: 1.1rem; padding: 2rem;"></div>
          </div>

          <div id="quiz" class="tab-content">
            <div class="quiz-container" id="quizContainer"></div>
            <div class="quiz-controls" style="margin-top: 2rem;">
              <button class="toon-btn" id="checkQuizBtn" style="background: var(--study); color: white; width: 100%; font-size: 1.2rem; padding: 1rem;">✅ Controlla Risposte</button>
            </div>
          </div>

          <div style="margin-top: 4rem; display: flex; justify-content: center;">
            <button class="toon-btn" id="downloadBtn" style="background: var(--xp); color: white; font-size: 1.3rem; padding: 1.2rem 3rem;">📥 Scarica PDF Studio</button>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script src="../js/env-config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/supabase-client.js"></script>
  <script src="../js/modules/auth.js"></script>
  <script>
    if (!checkAuthentication()) {
      window.location.href = 'index.html';
    }

    // HAMBURGER MENU
    const hamburgerBtn = document.getElementById('hamburgerBtn');
    const sidebar = document.querySelector('.sidebar');
    const body = document.body;

    hamburgerBtn?.addEventListener('click', (e) => {
      e.stopPropagation();
      sidebar?.classList.toggle('active');
      body.classList.toggle('menu-open');
    });

    body.addEventListener('click', (e) => {
      if (body.classList.contains('menu-open') && !sidebar?.contains(e.target) && e.target !== hamburgerBtn) {
        sidebar?.classList.remove('active');
        body.classList.remove('menu-open');
      }
    });

    sidebar?.addEventListener('click', (e) => {
      if (e.target.tagName === 'A' || e.target.tagName === 'BUTTON') {
        sidebar.classList.remove('active');
        body.classList.remove('menu-open');
      }
    });

    // PROFILE UI
    const themeToggle = document.getElementById('themeToggle');
    const navAvatar = document.getElementById('navAvatar');
    const guestNotice = document.getElementById('guestNotice');

    const user = {
      username: sessionStorage.getItem('username') || 'Studente',
      profileImage: sessionStorage.getItem('profileImage') || ''
    };

    function getInitials(name) {
      return name
        .split(' ')
        .filter(Boolean)
        .slice(0, 2)
        .map((part) => part[0].toUpperCase())
        .join('');
    }

    function updateProfileUI() {
      if (navAvatar) {
        if (user.profileImage) {
          navAvatar.style.backgroundImage = `url(${user.profileImage})`;
          navAvatar.textContent = '';
        } else {
          navAvatar.style.backgroundImage = '';
          navAvatar.textContent = getInitials(user.username);
        }
      }
    }

    function updateGuestMode() {
      const role = sessionStorage.getItem('role') || 'user';
      if (role === 'guest') {
        if (guestNotice) {
          guestNotice.style.display = 'block';
          guestNotice.textContent = 'Sei connesso come ospite: alcune funzionalità sono limitate.';
        }
      }
    }

    updateProfileUI();
    updateGuestMode();

    // THEME TOGGLE
    const savedTheme = localStorage.getItem('theme');
    if (savedTheme === 'dark') {
      document.body.classList.add('dark');
    }
    themeToggle?.setAttribute('aria-label', document.body.classList.contains('dark') ? 'Attiva modalità chiara' : 'Attiva modalità scura');

    themeToggle?.addEventListener('click', () => {
      document.body.classList.toggle('dark');
      localStorage.setItem('theme', document.body.classList.contains('dark') ? 'dark' : 'light');
      themeToggle.setAttribute('aria-label', document.body.classList.contains('dark') ? 'Attiva modalità chiara' : 'Attiva modalità scura');
    });

    // PHOTO ANALYSIS SYSTEM
    const photoUpload = document.getElementById('photoUpload');
    const uploadSection = document.getElementById('uploadSection');
    const uploadPreview = document.getElementById('uploadPreview');
    const analyzeBtn = document.getElementById('analyzeBtn');
    const clearBtn = document.getElementById('clearBtn');
    const resultsSection = document.getElementById('resultsSection');
    const downloadSchema = document.getElementById('downloadSchema');
    
    let currentImageData = null;
    let analysisResults = null;
    // Usa sempre apiFetch() che rispetta ENV.BACKEND_URL (se impostato) e
    // altrimenti passa dal proxy del frontend-server.js (consigliato in locale).

    // Photo upload handler
    photoUpload?.addEventListener('change', async (event) => {
      const file = event.target.files[0];
      if (!file) return;
      
      if (!file.type.startsWith('image/')) {
        alert('Per favore carica un file immagine.');
        return;
      }

      try {
        currentImageData = await normalizeImageForAnalysis(file);
        displayImagePreview(currentImageData);
        uploadSection.style.display = 'block';
        analyzeBtn.disabled = false;
      } catch (error) {
        console.error('Errore preparazione immagine:', error);
        alert('Impossibile preparare l\'immagine per l\'analisi.');
      }
    });

    async function normalizeImageForAnalysis(file) {
      const objectUrl = URL.createObjectURL(file);

      try {
        const image = await new Promise((resolve, reject) => {
          const img = new Image();
          img.onload = () => resolve(img);
          img.onerror = () => reject(new Error('Immagine non leggibile'));
          img.src = objectUrl;
        });

        const maxWidth = 1600;
        const scale = Math.min(1, maxWidth / image.width);
        const canvas = document.createElement('canvas');
        canvas.width = Math.max(1, Math.round(image.width * scale));
        canvas.height = Math.max(1, Math.round(image.height * scale));

        const context = canvas.getContext('2d');
        context.fillStyle = '#ffffff';
        context.fillRect(0, 0, canvas.width, canvas.height);
        context.drawImage(image, 0, 0, canvas.width, canvas.height);

        return canvas.toDataURL('image/jpeg', 0.92);
      } finally {
        URL.revokeObjectURL(objectUrl);
      }
    }

    function displayImagePreview(imageData) {
      uploadPreview.innerHTML = `
        <img src="${imageData}" alt="Preview" style="width: 100%; height: 300px; object-fit: cover; border-radius: 16px;">
        <p style="margin-top: 1rem; color: var(--muted);">Foto caricata - pronta per l'analisi AI</p>
      `;
    }

    // Clear photo
    clearBtn?.addEventListener('click', () => {
      currentImageData = null;
      analysisResults = null;
      uploadSection.style.display = 'none';
      resultsSection.style.display = 'none';
      photoUpload.value = '';
      uploadPreview.innerHTML = `
        <div class="preview-placeholder">
          <span style="font-size: 3rem;">?</span>
          <p>Anteprima foto</p>
        </div>
      `;
    });

    // Analyze photo with AI
    analyzeBtn?.addEventListener('click', async () => {
      if (!currentImageData) return;
      
      analyzeBtn.disabled = true;
      analyzeBtn.textContent = '🔍 Analizzando...';
      document.getElementById('backendNotice').style.display = 'none';
      
      try {
        analysisResults = await apiFetch('/api/schemi/analizza-foto', {
          method: 'POST',
          body: JSON.stringify({ imageDataUrl: currentImageData })
        });
        
        // Guadagno crediti per attività di studio
        if (window.CreditsModule) {
          window.CreditsModule.earnCrediti(30, 'Analisi Foto e Schemi');
        }

        // Display results
        displayResults(analysisResults);
        resultsSection.style.display = 'block';
        
      } catch (error) {
        console.error('Errore:', error);
        // Mostra il banner "backend non raggiungibile" solo per errori di rete/proxy,
        // non per errori di configurazione (es. API key mancante).
        if (/network/i.test(error.message) || /failed to fetch/i.test(error.message) || /502|504/.test(error.message)) {
          document.getElementById('backendNotice').style.display = 'block';
        }
        alert('Errore durante l\'analisi: ' + error.message);
      } finally {
        analyzeBtn.disabled = false;
        analyzeBtn.textContent = '? Analizza con AI';
      }
    });

    // Display comprehensive analysis results
    function displayResults(results) {
      // Display rewritten content
      const contenutoContainer = document.getElementById('contenutoContainer');
      if (contenutoContainer && results.contenuto) {
        contenutoContainer.innerHTML = `
          <div class="contenuto-text">${results.contenuto}</div>
        `;
      }
      
      // Display flashcards
      const flashcardContainer = document.getElementById('flashcardContainer');
      if (flashcardContainer && results.flashcard) {
        flashcardContainer.innerHTML = results.flashcard.map((card, index) => `
          <div class="flashcard-item">
            <div class="flashcard-number">${index + 1}</div>
            <div class="flashcard-content">
              <div class="flashcard-question">
                <strong>Domanda:</strong> ${card.domanda}
              </div>
              <div class="flashcard-answer">
                <strong>Risposta:</strong> ${card.risposta}
              </div>
            </div>
          </div>
        `).join('');
      }
      
      // Display schema
      const schemaContainer = document.getElementById('schemaContainer');
      if (schemaContainer && results.schema) {
        schemaContainer.innerHTML = `
          <pre class="schema-text">${results.schema}</pre>
        `;
      }
      
      // Display summary
      const riassuntoContainer = document.getElementById('riassuntoContainer');
      if (riassuntoContainer && results.riassunto) {
        riassuntoContainer.innerHTML = `
          <div class="riassunto-text">${results.riassunto}</div>
        `;
      }
      
      // Display quiz
      const quizContainer = document.getElementById('quizContainer');
      if (quizContainer && results.quiz && results.quiz.domande) {
        quizContainer.innerHTML = results.quiz.domande.map((question, index) => `
          <div class="quiz-question" data-question-index="${index}">
            <div class="quiz-question-header">
              Domanda ${index + 1}: ${question.domanda}
            </div>
            <div class="quiz-options">
              ${question.opzioni.map((option, optionIndex) => `
                <div class="quiz-option" data-option-index="${optionIndex}">
                  <input type="radio" name="question_${index}" value="${optionIndex}" style="margin: 0;">
                  <span>${option}</span>
                </div>
              `).join('')}
            </div>
          </div>
        `).join('');
      }
    }

    // Tab switching
    const tabButtons = document.querySelectorAll('.tab-btn');
    const tabContents = document.querySelectorAll('.tab-content');
    
    tabButtons.forEach(btn => {
      btn.addEventListener('click', () => {
        const targetTab = btn.dataset.tab;
        
        // Update buttons
        tabButtons.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        
        // Update content
        tabContents.forEach(content => {
          content.classList.remove('active');
          if (content.id === targetTab) {
            content.classList.add('active');
          }
        });
      });
    });

    // Download functions for all materials
    document.getElementById('downloadContenuto')?.addEventListener('click', () => {
      if (analysisResults && analysisResults.contenuto) {
        downloadFile(analysisResults.contenuto, 'contenuto_ordinato.txt');
      }
    });
    
    document.getElementById('downloadFlashcard')?.addEventListener('click', () => {
      if (analysisResults && analysisResults.flashcard) {
        const flashcardText = analysisResults.flashcard.map((card, index) => 
          `Flashcard ${index + 1}:\nDomanda: ${card.domanda}\nRisposta: ${card.risposta}\n\n`
        ).join('');
        downloadFile(flashcardText, 'flashcard.txt');
      }
    });
    
    document.getElementById('downloadSchema')?.addEventListener('click', () => {
      if (analysisResults && analysisResults.schema) {
        downloadFile(analysisResults.schema, 'schema_gerarchico.txt');
      }
    });
    
    document.getElementById('downloadRiassunto')?.addEventListener('click', () => {
      if (analysisResults && analysisResults.riassunto) {
        downloadFile(analysisResults.riassunto, 'riassunto.txt');
      }
    });
    
    document.getElementById('downloadQuiz')?.addEventListener('click', () => {
      if (analysisResults && analysisResults.quiz && analysisResults.quiz.domande) {
        const quizText = analysisResults.quiz.domande.map((question, index) => {
          const correctAnswer = question.opzioni[question.risposta_corretta];
          return `Domanda ${index + 1}: ${question.domanda}\nTipo: ${question.tipo}\nOpzioni:\n${question.opzioni.map((opt, i) => `  ${String.fromCharCode(65 + i)}. ${opt}`).join('\n')}\nRisposta corretta: ${String.fromCharCode(65 + question.risposta_corretta)}. ${correctAnswer}\n\n`;
        }).join('');
        downloadFile(quizText, 'quiz.txt');
      }
    });
    
    function downloadFile(content, filename) {
      const blob = new Blob([content], { type: 'text/plain' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      a.click();
      URL.revokeObjectURL(url);
    }
    
    // Quiz answer checking
    document.getElementById('checkQuizAnswers')?.addEventListener('click', () => {
      if (!analysisResults || !analysisResults.quiz) return;
      
      const quizQuestions = document.querySelectorAll('.quiz-question');
      quizQuestions.forEach((questionElement, questionIndex) => {
        const question = analysisResults.quiz.domande[questionIndex];
        const selectedOption = questionElement.querySelector('input[type="radio"]:checked');
        const options = questionElement.querySelectorAll('.quiz-option');
        
        // Remove previous classes
        options.forEach(option => {
          option.classList.remove('correct', 'incorrect', 'selected');
        });
        
        if (selectedOption) {
          const selectedIndex = parseInt(selectedOption.value);
          const correctIndex = question.risposta_corretta;
          
          options[selectedIndex].classList.add('selected');
          
          if (selectedIndex === correctIndex) {
            options[selectedIndex].classList.add('correct');
          } else {
            options[selectedIndex].classList.add('incorrect');
            options[correctIndex].classList.add('correct');
          }
        }
      });
    });
  </script>
</body>
</html>
